[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"
description = "Rust adapter for one-shot OpenCode v2 CLI runs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tidusvn05/agent-core"

[dependencies]
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
